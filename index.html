<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DGC</title>
  </head>
  <body>
    <header id="topbar">
      <div class="brand">DGC</div>
      <nav id="topnav">
        <button class="nav-btn" id="nav-devices">设 备</button>
        <button class="nav-btn" id="nav-settings">游戏设置</button>
        <button class="nav-btn" id="nav-help">游戏说明</button>
        <button class="nav-btn" id="nav-profile">昵 称</button>
      </nav>
      <div class="conn">
        <span class="pill" id="conn-pill"><span class="dot"></span><span id="conn-text">V4 未连接</span></span>
        <button class="btn-gold" id="btn-conn">连 接</button>
        <button class="btn-red" id="btn-e-stop" title="紧急停止：清空所有设备任务"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      </div>
    </header>
    <main id="game-wrap">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="screen-controls">
        <div id="game-entries">
          <button class="btn-gold btn-lg entry-btn" id="btn-start" hidden>小电机弹幕</button>
          <button class="btn btn-lg entry-btn" id="btn-versus" hidden>电击消消乐</button>
          <button class="btn-ghost btn-lg entry-btn" id="btn-board" hidden>排行榜</button>
        </div>
        <button class="ctl-btn pause" id="btn-pause" hidden>暂停</button>
        <button class="ctl-btn bomb" id="btn-bomb" hidden>炸弹 ×3</button>
      </div>
      <div id="battle-root" hidden>
        <div id="battle-col">
          <div id="battle-top">
            <div class="player-block" id="pb-self">
              <div class="pb-name" id="pb-self-name">我方</div>
              <div class="pb-gauges" id="my-gauges"></div>
              <div class="pb-score">
                <div class="suffer-label"><span>我方分数</span><span id="target-val" class="hint" style="font-size:11px">目标 5000</span></div>
                <div class="suffer-bar"><div class="suffer-fill" id="my-score-fill" style="width:0%; background:linear-gradient(90deg,#f0c866,#ffd97e)"></div></div>
              </div>
              <div class="dev-line" id="my-dev-line">本机：未连接</div>
            </div>
            <div class="player-block" id="pb-opp">
              <div class="pb-name" id="pb-opp-name">对方</div>
              <div class="pb-gauges" id="opp-gauges"></div>
              <div class="pb-score">
                <div class="suffer-label"><span>对方分数</span></div>
                <div class="suffer-bar"><div class="suffer-fill" id="opp-score-fill" style="width:0%"></div></div>
              </div>
              <div class="dev-line" id="opp-dev-line">对方：未知</div>
            </div>
          </div>
          <div id="battle-main">
            <canvas id="battle-canvas"></canvas>
            <div id="battle-side">
              <div class="suffer-label" style="margin-top:2px"><span>我方 <b id="my-score-val">0</b></span><span>对方 <b id="opp-score-val">0</b></span></div>
              <div class="badge-mult" id="mult-val">倍率 ×1.0</div>
              <div class="buff-line" id="buff-line"></div>
              <div class="sec">效果能量<span class="hint" style="font-weight:normal; font-size:11px">（消除自动触发）</span></div>
              <div class="en-row"><span class="en-ico" style="background:#ff4c5e"><svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H6.5c-.58 0-.57-.32-.38-.66l.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h4.5c.49 0 .56.33.47.51l-.07.15C14.96 17.55 13 21 13 21z" fill="#fff"/></svg></span><span class="en-name">电击</span><div class="en-bar"><div class="en-fill" id="en-fill-0" style="background:#ff4c5e;width:0%"></div></div><span class="en-val" id="en-val-0">0</span></div>
              <div class="en-row"><span class="en-ico" style="background:#4cc2ff"><svg viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" fill="#fff"/></svg></span><span class="en-name">护盾</span><div class="en-bar"><div class="en-fill" id="en-fill-1" style="background:#4cc2ff;width:0%"></div></div><span class="en-val" id="en-val-1">0</span></div>
              <div class="en-row"><span class="en-ico" style="background:#4cff9d"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#fff"/></svg></span><span class="en-name">净化</span><div class="en-bar"><div class="en-fill" id="en-fill-2" style="background:#4cff9d;width:0%"></div></div><span class="en-val" id="en-val-2">0</span></div>
              <div class="en-row"><span class="en-ico" style="background:#f0c866"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 7.5V12l3.5 2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span><span class="en-name">时停</span><div class="en-bar"><div class="en-fill" id="en-fill-3" style="background:#f0c866;width:0%"></div></div><span class="en-val" id="en-val-3">0</span></div>
              <div class="en-row"><span class="en-ico" style="background:#b06cff"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span><span class="en-name">倍率</span><div class="en-bar"><div class="en-fill" id="en-fill-4" style="background:#b06cff;width:0%"></div></div><span class="en-val" id="en-val-4">0</span></div>
              <div class="en-row"><span class="en-ico" style="background:#ff9d4c"><svg viewBox="0 0 24 24"><path d="M12 17V8M7.5 12L12 7l4.5 5M6.5 19.5h11" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span><span class="en-name">增幅</span><div class="en-bar"><div class="en-fill" id="en-fill-5" style="background:#ff9d4c;width:0%"></div></div><span class="en-val" id="en-val-5">0</span></div>
              <div>
                <div class="suffer-label"><span>我的承受</span><span id="my-suffer-val">0</span></div>
                <div class="suffer-bar"><div class="suffer-fill" id="my-suffer-fill" style="width:0%"></div></div>
              </div>
            </div>
          </div>
        </div>
        <div id="ready-overlay">
          <div class="ready-title">准备对战</div>
          <div class="ready-status" id="ready-status">连接设备、调好设置后点击「准备」</div>
          <button class="btn-gold" id="btn-ready" style="padding:12px 52px; font-size:18px; letter-spacing:6px">准 备</button>
        </div>
        <div id="freeze-overlay" hidden><div class="ovt-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg> 棋盘被冻结</div><div id="freeze-sec"></div></div>
        <div id="overload-overlay" hidden><div class="ovt-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" fill="currentColor" stroke="none"/></svg> 承受过载</div><div id="overload-sec"></div></div>
        <div id="battle-toast" class="hint" style="position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(23,26,33,0.9); padding:6px 16px; border-radius:8px; border:1px solid var(--border)" hidden></div>
      </div>
    </main>

      <div class="result-overlay punish" id="result-punish" hidden>
      <div class="result-title">战败惩罚中</div>
      <div class="result-info">第 <b id="punish-round">0</b> 轮 · 强度 <b id="punish-power">0</b> · 剩余 <b id="punish-left">--</b> 秒</div>
      <div class="result-actions"><button class="btn-red" id="btn-surrender" style="padding:10px 36px; font-size:16px">认输（10 秒后可点）</button></div>
    </div>
    <div class="result-overlay" id="result-punish-end" hidden>
      <div class="result-title" style="color:var(--text)">惩罚结束</div>
      <div class="result-info" id="punish-end-info"></div>
      <div class="result-actions">
        <button class="btn-gold" id="btn-rematch-l">再来一局</button>
        <button class="btn" id="btn-exit-l">返回标题</button>
      </div>
    </div>
    <div class="result-overlay victory" id="result-victory" hidden>
      <div class="result-title">对方战败</div>
      <div class="result-info" id="victory-info">惩罚进行中…</div>
      <div id="victory-controls" class="result-controls">
        <div class="row"><label>惩罚波形</label><select id="punish-wave" style="flex:1"></select></div>
        <div class="row"><label>惩罚强度</label><input type="range" id="punish-intensity" min="0" max="100" value="0" style="flex:1" /><span class="val" id="punish-intensity-val">自动</span></div>
        <div class="hint" style="text-align:center">强度上限 = 对方设置的上限；0 为自动随机</div>
      </div>
      <div class="result-actions" id="victory-actions-punish">
        <button class="btn" id="btn-stop-punish"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg> 停止惩罚</button>
        <button class="btn" id="btn-victory-exit">返回标题</button>
      </div>
      <div class="result-actions" id="victory-actions-end" hidden>
        <button class="btn-gold" id="btn-rematch-v">再来一局</button>
        <button class="btn" id="btn-victory-exit2">返回标题</button>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-devices" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span class="modal-title">设 备</span>
          <button class="modal-x" data-close>✕</button>
        </div>
        <div class="modal-body" id="devices-body"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-settings" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span class="modal-title">游戏设置</span>
          <button class="modal-x" data-close>✕</button>
        </div>
        <div class="modal-body" id="settings-body"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-board" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span class="modal-title">排行榜</span>
          <button class="modal-x" data-close>✕</button>
        </div>
        <div class="modal-body" id="board-body">
          <div class="tabs">
            <button class="tab board-tab active" id="board-tab-bullet">小电机弹幕</button>
            <button class="tab board-tab" id="board-tab-versus">电击消消乐</button>
          </div>
          <div class="board-table" id="board-list"></div>
          <div class="hint" id="board-hint" style="text-align:center; margin-top:8px"></div>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-battle" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span class="modal-title">宝石对战</span>
          <button class="modal-x" data-close>✕</button>
        </div>
        <div class="modal-body" id="battle-lobby-body"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-help" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span class="modal-title">游戏说明</span>
          <button class="modal-x" data-close>✕</button>
        </div>
        <div class="modal-body" id="help-body"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-profile" hidden>
      <div class="modal-card" style="width:min(440px, calc(100vw - 48px))">
        <div class="modal-head">
          <span class="modal-title">昵称档案</span>
          <button class="modal-x" data-close>✕</button>
        </div>
        <div class="modal-body" id="profile-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
